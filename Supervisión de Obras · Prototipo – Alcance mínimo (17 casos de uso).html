      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

round:#F3F6F7}.phone{width:100%;height:calc(100vh - 40px);border:0;border-radius:0;box-shadow:none}.stage .aside{display:none}}\n.ptop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px;background:#fff;border-bottom:1px solid #DAE2E5}\n.pwrap{width:100%;max-width:1100px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:18px}\n.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}\n.steps li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#F5F8F9;font-size:14px}\n.steps li.ok{background:#E2F3E9}.steps li.run{background:#E2EEF1}.steps li.fail{background:#FCE8E6}.steps li.comp{background:#FDEEDC}.steps li.skip{opacity:.5}\n.log{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#0F2228;color:#CFE3E8;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto}\n.thumb{border-radius:10px;overflow:hidden;border:1px solid #DAE2E5;background:#fff;cursor:pointer;text-align:left;padding:0;display:block;width:100%}\n.thumb.on{outline:3px solid #0E4D5C}\n.map{display:block;background:#EAF0E8;border-radius:10px;border:1px solid #DAE2E5;cursor:crosshair}\n.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}\n@keyframes sp{to{transform:rotate(360deg)}}\n.live{color:#1B7343;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}\n.live .dot{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.3}}\n<\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; display: flex; flex-direction: column; background: #F2F5F6\" data-canvas-width=\"1440\" data-canvas-height=\"900\" data-document-role=\"page\" data-label=\"Prototipo completo (ERP · App móvil · Portal)\">\n  <div class=\"demobar\">\n    <span class=\"tag\">DEMO<\/span>\n    <span>Constructora Andina S.R.L. · prototipo sin servidor<\/span>\n    <span class=\"sp\"><\/span>\n    <sc-if value=\"{{hasUser}}\" hint-placeholder-val=\"{{false}}\">\n      <span>Usuario actual: <b>{{userLabel}}<\/b> · {{userRole}} · {{userApp}}<\/span>\n      <button class=\"dbtn\" sc-camel-on-click=\"{{logout}}\">Cambiar de usuario<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{multiApp}}\" hint-placeholder-val=\"{{false}}\">\n      <span>Ir a (misma sesión):<\/span>\n      <sc-for list=\"{{appsSw}}\" as=\"x\" hint-placeholder-count=\"0\">\n        <sc-if value=\"{{x.ok}}\" hint-placeholder-val=\"{{true}}\"><button class=\"dbtn {{x.cls}}\" sc-camel-on-click=\"{{x.go}}\">{{x.label}}<\/button><\/sc-if>\n      <\/sc-for>\n    <\/sc-if>\n    <sc-if value=\"{{isErp}}\" hint-placeholder-val=\"{{false}}\">\n      <label class=\"dsw\"><input type=\"checkbox\" checked=\"{{erpOffline}}\" sc-camel-on-change=\"{{toggleErpOff}}\"> ERP sin conexión (PWA)<\/label>\n    <\/sc-if>\n    <label class=\"dsw\"><input type=\"checkbox\" checked=\"{{failFin}}\" sc-camel-on-change=\"{{toggleFail}}\"> Simular fallo en Finanzas<\/label>\n    <button class=\"dbtn\" sc-camel-on-click=\"{{reset}}\">Reiniciar demo<\/button>\n  <\/div>\n  <sc-if value=\"{{isLogin}}\" hint-placeholder-val=\"{{true}}\"><dc-import name=\"Login\" app=\"{{app}}\" hint-size=\"100%,760px\"><\/dc-import><\/sc-if>\n  <sc-if value=\"{{isErp}}\" hint-placeholder-val=\"{{false}}\"><dc-import name=\"Erp\" app=\"{{app}}\" hint-size=\"100%,860px\"><\/dc-import><\/sc-if>\n  <sc-if value=\"{{isMovil}}\" hint-placeholder-val=\"{{false}}\"><dc-import name=\"Movil\" app=\"{{app}}\" hint-size=\"100%,900px\"><\/dc-import><\/sc-if>\n  <sc-if value=\"{{isPortal}}\" hint-placeholder-val=\"{{false}}\"><dc-import name=\"Portal\" app=\"{{app}}\" hint-size=\"100%,860px\"><\/dc-import><\/sc-if>\n  <div class=\"toasts\" aria-live=\"polite\">\n    <sc-for list=\"{{toasts}}\" as=\"t\" hint-placeholder-count=\"0\">\n      <div class=\"toast {{t.kind}}\"><span class=\"ti\">{{t.icon}}<\/span><span>{{t.txt}}<\/span><\/div>\n    <\/sc-for>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\n// ═════════ Estado compartido de las tres aplicaciones (ERP, App móvil, Portal) ═════════\n// Módulos: obras · materiales · finanzas · campo (app móvil + sincronización) · portal · agente/voz\nconst DAY = 86400000, KEY = 'csa-supervision-demo-v2';\n// apps: aplicaciones a las que el usuario entra con la misma sesión (SSO); app: la que abre al iniciar sesión\nconst USERS = {\n  admin1: { nombre: 'Administración', rol: 'admin', rolTxt: 'Administrador', app: 'erp', apps: ['erp'] },\n  crojas: { nombre: 'Ing. Carla Rojas', rol: 'residente', rolTxt: 'Residente', app: 'erp', apps: ['erp', 'movil'] },\n  gerente1: { nombre: 'Gerente General', rol: 'gerente', rolTxt: 'Gerente', app: 'erp', apps: ['erp'] },\n  juan: { nombre: 'Juan Pérez', rol: 'maestro', rolTxt: 'Maestro de obra', app: 'movil', apps: ['movil'] },\n  mario: { nombre: 'Mario Vaca', rol: 'almacenero', rolTxt: 'Almacenero', app: 'movil', apps: ['movil'] },\n  cliente1: { nombre: 'Alcaldía Municipal', rol: 'cliente', rolTxt: 'Cliente', app: 'portal', apps: ['portal'] }\n};\nconst APPS = { erp: 'ERP', movil: 'App móvil', portal: 'Portal del cliente' };\nconst PERM = {\n  'obra.crear': ['admin', 'gerente'], 'material.gestionar': ['admin', 'gerente'],\n  'planilla.editar': ['residente', 'admin'], 'planilla.aprobar': ['cliente'],\n  'foto.publicar': ['residente', 'admin'], 'finanzas.ver': ['gerente', 'admin'],\n  'agente.usar': ['gerente', 'admin'], 'campo.registrar': ['maestro', 'almacenero', 'residente']\n};\nconst MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];\nconst TIPO_TXT = { asistencia: 'Asistencia', foto: 'Foto de avance', diario: 'Diario de obra', mov: 'Material' };\n\nfunction uid() {\n  if (window.cr - a.emitido);\n    const vis = this.obrasVis(S).map(o => obraById[o.id]);\n    const visIds = vis.map(o => o.id);\n    const porCobrar = cobros.filter(c => c.estado !== 'PAGADO' && visIds.indexOf(c.obra) >= 0).reduce((a, c) => a + c.monto, 0);\n    const alertas = S.alertas.filter(a => visIds.indexOf(a.obra) >= 0).map(a => ({ ...a, obraNombre: obraById[a.obra] ? obraById[a.obra].nombre : '', hora: fdate(a.ts) + ' ' + ftime(a.ts), cls: a.nivel === 'err' ? 'err' : a.nivel === 'warn' ? 'warn' : 'info', icon: a.nivel === 'err' ? '✘' : a.nivel === 'warn' ? '⚠' : '●' }));\n    return { obras, vis, visIds, stock, cobros, porCobrar, alertas, matById, provById, obraById, partById };\n  }\n\n  renderVals() {\n    const S = this.state.S, U = this.state.U;\n    const u = S.user ? USERS[S.user] : null;\n    const cur = u ? (S.app && u.apps.indexOf(S.app) >= 0 ? S.app : u.app) : null;\n    const app = { S, U, user: u, uid: S.user, a: this.A, f: this.F, d: this.derive(S) };\n    // SSO: con la misma sesión se pasa a cualquier aplicación permitida, sin volver a iniciar sesión\n    const appsSw = u ? Object.keys(APPS).map(k => ({ label: APPS[k], cls: k === cur ? 'on' : '', ok: u.apps.indexOf(k) >= 0, go: () => this.A.setApp(k) })) : [];\n    return {\n      app, hasUser: !!u, isLogin: !u, isErp: cur === 'erp', isMovil: cur === 'movil', isPortal: cur === 'portal',\n      userLabel: u ? u.nombre : '', userRole: u ? u.rolTxt : '', userApp: cur ? APPS[cur] : '',\n      appsSw, multiApp: !!u && u.apps.length > 1,\n      erpOffline: !!S.erpOffline, toggleErpOff: e => this.A.setFlag('erpOffline', e.target.checked),\n      failFin: !!S.failFin, toggleFail: e => this.A.setFlag('failFin', e.target.checked),\n      reset: () => this.A.reset(), logout: () => this.A.logout(), toasts: U.toasts\n    };\n  }\n\n  // ══════ módulo CAMPO: cola local del celular + sincronización ══════\n  encolar(tipo, payload, kb) {\n    const id = uid();\n    this.upd(S => { S.cola.push({ id, tipo, user: S.user, payload, estado: 'PENDIENTE', ts: Date.now(), kb: kb || 1, prog: 0, err: null }); });\n    return id;\n  }\n  kick() { if (!this.S.offline) this.scheduleSync(900); }\n  scheduleSync(ms) { clearTimeout(this.syncT); this.syncT = setTimeout(() => this.runSync(false), ms || 700); }\n  async runSync(manual) {\n    if (this.busy.sync) return;\n    if (this.S.offline) { if (manual) this.toast('Sin señal: los registros siguen guardados en el celular', 'warn'); return; }\n    this.busy.sync = true; clearTimeout(this.retryT);\n    this.upd(S => { S.retryAt = null; });\n    this.setU({ syncing: true });\n    const slow = this.S.weak ? 3 : 1;\n    const pend = this.S.cola.filter(x => x.estado !== 'ENVIADO');\n    const light = pend.filter(x => x.kb <= 100), heavy = pend.filter(x => x.kb > 100);\n    const errPick = !this.S.errDone && light.length >= 3 ? light[1].id : null;\n    for (const it of light) {\n      if (this.S.offline) break;\n      await sleep(380 * slow);\n      if (this.S.offline) break;\n      this.sendOne(it.id, it.id === errPick);\n    }\n    for (const it of heavy) {\n      if (this.S.offline) break;\n      for (let p = 8; p <= 100; p += 12) {\n        if (this.S.offline) break;\n        await sleep(170 * slow);\n        this.upd(S => { const x = S.cola.find(c => c.id === it.id); if (x) x.prog = Math.min(100, p); });\n      }\n      if (this.S.offline) { this.upd(S => { const x = S.cola.find(c => c.id === it.id); if (x) x.prog = 0; }); break; }\n      this.sendOne(it.id, false);\n    }\n    if (!this.S.offline) {\n      this.upd(S => {\n        const snap = {}; S.stock.filter(s => s.obra === 'esc').forEach(s => { snap[s.mat] = s.cant; });\n        S.snap = { ts: Date.now(), stock: snap }; S.lastSync = Date.now();\n        const errs = S.cola.filter(x => x.estado === 'ERROR').length;\n        if (errs) { S.retryN = (S.retryN || 0) + 1; S.retryAt = Date.now() + Math.min(30, Math.pow(2, S.retryN + 1)) * 1000; } else { S.retryN = 0; S.retryAt = null; }\n      });\n      if (this.S.retryAt) this.retryT = setTimeout(() => this.runSync(false), this.S.retryAt - Date.now() + 60);\n      if (pend.length && !this.S.cola.some(x => x.estado === 'ERROR')) this.toast('Sincronización completa: los registros ya están en el ERP', 'ok');\n    }\n    this.busy.sync = false; this.setU({ syncing: false });\n    if (!this.S.offline && this.S.cola.some(x => x.estado === 'PENDIENTE')) this.scheduleSync(500);\n  }\n  sendOne(id, simulaTimeout) {\n    this.upd(S => {\n      const it = S.cola.find(c => c.id === id); if (!it) return;\n      const short = it.id.slice(0, 4), lab = TIPO_TXT[it.tipo];\n      if (S.procesados.indexOf(it.id) >= 0) {\n        it.estado = 'ENVIADO'; it.err = null; it.sent = Date.now();\n        S.syncLog.unshift({ ts: Date.now(), k: 'dup', t: 'Operación ' + short + '… ya procesada, ignorada (no se duplica)' });\n      } else {\n        this.applyServer(S, it); S.procesados.push(it.id);\n        if (simulaTimeout) {\n          it.estado = 'ERROR'; it.err = 'Tiempo de espera agotado: el servidor no confirmó'; S.errDone = true;\n          S.syncLog.unshift({ ts: Date.now(), k: 'err', t: '✘ ' + lab + ' ' + short + '… sin confirmación (timeout)' });\n        } else {\n          it.estado = 'ENVIADO'; it.err = null; it.sent = Date.now(); it.prog = 100;\n          S.syncLog.unshift({ ts: Date.now(), k: 'ok', t: '✔ ' + lab + ' ' + short + '… recibido por el servidor' });\n        }\n      }\n      S.syncLog = S.syncLog.slice(0, 16);\n    });\n  }\n  // Lo que hace el servidor al recibir cada registro del campo\n  applyServer(S, it) {\n    const p = it.payload, ob = 'esc';\n    const tn = id => { const t = S.trabajadores.find(x => x.id === id); return t ? t.nombre : '—'; };\n    const pn = id => { const x = S.partidas.find(q => q.id === id); return x ? x.nombre : '—'; };\n    if (it.tipo === 'asistencia') S.asistencias.push({ id: it.id, obra: ob, trab: p.trab, ts: it.ts, verificado: p.verificado, precision: p.precision, user: it.user });\n    if (it.tipo === 'diario') S.diario.push({ id: it.id, obra: ob, ts: it.ts, clima: p.clima, texto: p.texto, user: it.user });\n    if (it.tipo === 'foto') {\n      S.fotos.push({ id: it.id, obra: ob, partida: p.partida, ts: it.ts, kb: it.kb, personas: 3, sinCasco: p.sinCasco, falso: !!p.falso, publicada: false, autor: it.user, tono: 0 });\n      if (p.sinCasco) this.alerta(S, 'err', ob, 'Seguridad', 'Foto con 1 persona sin casco · ' + pn(p.partida) + ' (confirmado por ' + USERS[it.user].nombre + ')');\n    }\n    if (it.tipo === 'mov') this.aplicarMov(S, { ...p, id: it.id, ts: it.ts, user: it.user, obra: ob });\n  }\n\n  // ══════ módulo MATERIALES: se guardan hechos (entró / salió), el stock se calcula aquí ══════\n  aplicarMov(S, m) {\n    const mat = S.materiales.find(x => x.id === m.mat);\n    let st = S.stock.find(x => x.obra === m.obra && x.mat === m.mat);\n    if (!st) { st = { obra: m.obra, mat: m.mat, cant: 0, min: 0 }; S.stock.push(st); }\n    S.movs.push({ id: m.id, obra: m.obra, tipo: m.tipo, mat: m.mat, cant: m.cant, partida: m.partida || null, prov: m.prov || null, ts: m.ts, user: m.user, pu: mat.precio, remision: !!m.foto });\n    if (m.tipo === 'SALIDA') {\n      if (m.cant > st.cant) this.alerta(S, 'warn', m.obra, 'Stock', 'Salida de ' + m.cant + ' ' + mat.unidadPl + ' de ' + mat.nombre + ' supera el stock registrado (' + st.cant + '). Revisar.');\n      st.cant -= m.cant;\n      this.revisarStock(S, m.obra, m.mat);\n      this.revisarConsumo(S, m.obra);\n    } else {\n      st.cant += m.cant;\n      const prov = S.proveedores.find(p => p.id === m.prov) || {};\n      S.cxp.push({ id: 'F-' + (1200 + S.cxp.length), prov: m.prov, obra: m.obra, concepto: m.cant + ' ' + mat.unidadPl + ' ' + mat.nombre, monto: m.cant * mat.precio, emitido: Date.now(), vence: Date.now() + 30 * DAY, pagado: null });\n      const oc = S.ordenes.find(o => o.obra === m.obra && o.mat === m.mat && o.estado === 'ENVIADA');\n      if (oc) oc.estado = 'RECIBIDA';\n      this.alerta(S, 'info', m.obra, 'Material', 'Ingreso de ' + m.cant + ' ' + mat.unidadPl + ' de ' + mat.nombre + (prov.nombre ? ' (' + prov.nombre + ')' : ''));\n    }\n  }\n  revisarStock(S, obra, matId) {\n    const st = S.stock.find(x => x.obra === obra && x.mat === matId); const mat = S.materiales.find(x => x.id === matId);\n    if (!st || st.cant >= st.min) return;\n    const abierta = S.ordenes.some(o => o.obra === obra && o.mat === matId && o.estado === 'ENVIADA');\n    if (abierta) return;\n    const prov = S.proveedores.find(p => p.id === mat.prov);\n    if (!prov) return;\n    const cant = Math.ceil((st.min * 2 - st.cant) / 10) * 10, monto = cant * mat.precio;\n    const n = Math.max.apply(null, S.ordenes.map(o => +o.id.slice(3))) + 1;\n    const id = 'OC-' + pad(n).padStart(3, '0');\n    // flujo automático (n8n): Materiales avisa stock bajo → Finanzas crea la orden → se envía el correo al proveedor\n    S.ordenes.push({ id, obra, prov: prov.id, mat: matId, cant, monto, estado: 'ENVIADA', ts: Date.now(), auto: true });\n    S.correos.unshift({ ts: Date.now(), para: prov.email, asunto: 'Orden de compra ' + id + ' · ' + cant + ' ' + mat.unidadPl + ' de ' + mat.nombre });\n    this.alerta(S, 'warn', obra, 'Stock', 'Stock bajo de ' + mat.nombre + ' (' + st.cant + ' / mín. ' + st.min + ') · ' + id + ' enviada a ' + prov.nombre);\n    setTimeout(() => this.toast('Orden ' + id + ' creada sola · Correo enviado a ' + prov.email, 'mail'), 50);\n  }\n  revisarConsumo(S, obra) {\n    control(S, obra, null).forEach(r => {\n      if (!r.atipico || S.atipicos.some(a => a.obra === obra && a.mat === r.mat && a.partida === r.partida)) return;\n      S.atipicos.push({ obra, mat: r.mat, partida: r.partida, diff: r.diff, ts: Date.now() });\n      this.alerta(S, 'warn', obra, 'Consumo atípico', 'Consumo atípico de ' + r.matNombre.split(' ')[0].toLowerCase() + ' en ' + r.partidaNombre + ': ' + num(r.used) + ' ' + r.unidad + ' usadas vs ' + num(r.prev) + ' previstas (+' + Math.round(r.diff) + '%)');\n    });\n  }\n\n  // ══════ módulo OBRAS: planilla de avance ══════\n  calcPlanilla(S, pl) {\n    const o = S.obras.find(x => x.id === pl.obra);\n    const prevAcum = {};\n    S.planillas.forEach(p => { if (p.obra === pl.obra && p.id !== pl.id && p.estado === 'APROBADA' && p.num < pl.num) Object.keys(p.lineas).forEach(k => { prevAcum[k] = (prevAcum[k] || 0) + toNum(p.lineas[k]); }); });\n    const lines = S.partidas.filter(p => p.obra === pl.obra).map(p => {\n      const raw = pl.lineas[p.id] == null ? '' : String(pl.lineas[p.id]);\n      const med = toNum(raw), prev = prevAcum[p.id] || 0, nuevo = prev + med;\n      const err = med < 0 ? 'No puede ser negativo' : nuevo > p.cant + 1e-9 ? 'Supera lo contratado · saldo ' + num(p.cant - prev, 2) + ' ' + p.unidad : '';\n      return { id: p.id, nombre: p.nombre, unidad: p.unidad, cant: p.cant, pu: p.pu, raw, med, prev, nuevo, monto: r2(med * p.pu), err };\n    });\n    const subtotal = r2(lines.reduce((a, l) => a + l.monto, 0));\n    const anticipo = r2(subtotal * o.anticipo / 100), retencion = r2(subtotal * o.retencion / 100);\n    return { lines, subtotal, anticipo, retencion, neto: r2(subtotal - anticipo - retencion), errores: lines.filter(l => l.err).length, obra: o };\n  }\n  // ══════ PORTAL → transacción entre 3 servicios (Obras · Materiales · Finanzas) con compensación ══════\n  async aprobar(plId) {\n    if (this.busy.saga) return;\n    if (!this.can('planilla.aprobar')) return this.deny();\n    const pl0 = this.S.planillas.find(p => p.id === plId);\n    if (!pl0 || pl0.estado !== 'PRESENTADA') { this.toast('Esta planilla ya no está pendiente de aprobación', 'warn'); return; }\n    this.busy.saga = true;\n    const calc = this.calcPlanilla(this.S, pl0);\n    const steps = [\n      { t: '1. Planilla bloqueada para edición', m: 'Obras', st: 'wait' },\n      { t: '2. Consumos del periodo cerrados', m: 'Materiales', st: 'wait' },\n      { t: '3. Emitiendo cobro', m: 'Finanzas', st: 'wait' },\n      { t: '4. Planilla aprobada', m: 'Obras', st: 'wait' }\n    ];\n    const show = extra => this.setU({ saga: Object.assign({ plId, steps: steps.map(x => ({ ...x })), done: false }, extra || {}) });\n    const pf = (S, fn) => { const p = S.planillas.find(x => x.id === plId); fn(p); };\n    const who = USERS[this.S.user].nombre;\n    steps[0].st = 'run'; show(); await sleep(800);\n    this.upd(S => pf(S, p => { p.estado = 'APROBANDO'; p.hist.push({ ts: Date.now(), t: 'Aprobación iniciada por ' + who }); }));\n    steps[0].st = 'ok'; steps[1].st = 'run'; show(); await sleep(800);\n    this.upd(S => { S.cierres.push({ obra: pl0.obra, periodo: pl0.periodo, pl: plId, ts: Date.now() }); });\n    steps[1].st = 'ok'; steps[2].st = 'run'; show(); await sleep(1100);\n    if (this.S.failFin) {\n      steps[2].st = 'fail'; steps[2].t = '3. Emitir cobro: rechazado · el monto supera el saldo del contrato'; show(); await sleep(800);\n      steps.push({ t: '↩ Consumos reabiertos', m: 'Materiales', st: 'comp' });\n      this.upd(S => { S.cierres = S.cierres.filter(c => c.pl !== plId); }); show(); await sleep(800);\n      steps.push({ t: '↩ Planilla vuelve a OBSERVADA · Motivo: el monto supera el saldo del contrato', m: 'Obras', st: 'comp' });\n      steps[3].st = 'skip';\n      this.upd(S => {\n        pf(S, p => { p.estado = 'OBSERVADA'; p.obs = 'El monto supera el saldo del contrato (Finanzas rechazó el cobro)'; p.hist.push({ ts: Date.now(), t: 'Compensación: vuelve a OBSERVADA' }); });\n        this.alerta(S, 'err', pl0.obra, 'Planilla', 'Planilla #' + pl0.num + ' no se aprobó: Finanzas rechazó el cobro. Se deshicieron los pasos.');\n      });\n      show({ done: true, ok: false, result: 'No se aprobó la planilla #' + pl0.num + '. Los pasos anteriores se deshicieron en orden inverso.' });\n    } else {\n      let cid = '';\n      this.upd(S => {\n        const n = Math.max.apply(null, S.cobros.map(c => +c.id.slice(2))) + 1; cid = 'C-' + String(n).padStart(3, '0');\n        S.cobros.push({ id: cid, obra: pl0.obra, pl: plId, num: pl0.num, monto: calc.neto, emitido: Date.now(), vence: Date.now() + 30 * DAY, pagado: null });\n      });\n      steps[2].st = 'ok'; steps[2].t = '3. Cobro ' + cid + ' emitido · ' + money(calc.neto); steps[3].st = 'run'; show(); await sleep(800);\n      this.upd(S => {\n        pf(S, p => { p.estado = 'APROBADA'; p.aprobada = Date.now(); p.cobro = cid; p.hist.push({ ts: Date.now(), t: 'APROBADA por ' + who + ' · ' + cid }); });\n        this.alerta(S, 'info', pl0.obra, 'Planilla', 'Planilla #' + pl0.num + ' APROBADA por el cliente · cobro ' + cid + ' por ' + money(calc.neto));\n      });\n      steps[3].st = 'ok';\n      show({ done: true, ok: true, result: 'Planilla APROBADA · Cobro ' + cid + ' emitido · vence en 30 días' });\n    }\n    this.busy.saga = false;\n  }\n\n  // ══════ AGENTE «Vigila mis obras» (solo lee y propone) ══════\n  async runAgent() {\n    if (!this.can('agente.usar')) return this.deny();\n    if (this.busy.agent) return;\n    this.busy.agent = true;\n    const D = this.derive(this.S), esc = D.obraById.esc;\n    const ctl = control(this.S, 'esc', null).filter(r => r.mat === 'cem').sort((a, b) => b.diff - a.diff)[0];\n    const diar = this.S.diario.filter(d => d.obra === 'esc' && /fierro/i.test(d.texto)).sort((a, b) => a.ts - b.ts);\n    const sg = v => (v >= 0 ? '+' : '') + Math.round(v) + '%';\n    const plan = [\n      { tool: 'obras.avance', args: '(todas las obras)', out: D.obras.map(o => o.nombre + ': ' + o.avanceTxt + ' vs plazo ' + o.plazoTxt).join(' · ') },\n      { tool: 'prediccion.retraso', args: '(obra = \"Escuela 1ro de Mayo\")', out: 'riesgo ' + esc.riesgoVal + ' · ' + esc.riesgoTxt + ' · otras: Camino Warnes 0,55 · Edificio Equipetrol 0,12' },\n      { tool: 'diario.buscar', args: '(obra = Escuela, texto ~ \"faltó | sin llegar | fierro\")', out: diar.length + ' entradas: ' + diar.map(d => fdate(d.ts) + ' «' + d.texto.split('.')[0] + '»').join(' · ') },\n      { tool: 'materiales.anoma at && m.tipo === 'SALIDA' && sameMonth(m.ts)).sort((a, b) => a.ts - b.ts);\n      const cant = rows.reduce((a, m) => a + m.cant, 0), monto = rows.reduce((a, m) => a + m.cant * m.pu, 0);\n      const mes = MESES[new Date().getMonth()];\n      const txt = !rows.length ? 'En ' + mes + ' no hay salidas de ' + M.nombre + ' registradas en ' + oName(obra) + '.'\n        : intent === 'gasto' ? 'En ' + mes + ' se gastaron ' + money(monto) + ' en ' + M.nombre + ' en ' + oName(obra) + ': ' + num(cant) + ' ' + M.unidadPl + ' en ' + rows.length + ' salidas de almacén, valorizadas a ' + money(M.precio) + ' por ' + M.unidad + '.'\n          : 'En ' + mes + ' se usaron ' + num(cant) + ' ' + M.unidadPl + ' de ' + M.nombre + ' en ' + oName(obra) + ' (' + rows.length + ' salidas, ' + money(monto) + ').';\n      return {\n        kind: 'answer', st: { intent, mat, obra }, chips: [intent === 'gasto' ? 'gasto' : 'consumo', 'material = ' + M.nombre.split(' ')[0].toLowerCase(), 'obra = ' + oName(obra).split(' ')[0], 'mes actual'],\n        txt, cols: ['Fecha', 'Registro', 'Partida', 'Cantidad', 'P. unit.', 'Monto'],\n        rows: rows.map(m => ({ cells: [{ v: fdate(m.ts) }, { v: 'Salida ' + m.id.slice(0, 4) + '… · ' + (USERS[m.user] ? USERS[m.user].nombre : m.user) }, { v: D.partById[m.partida] ? D.partById[m.partida].nombre : '—' }, { v: num(m.cant) + ' ' + M.unidadPl, c: 'r' }, { v: money(m.pu), c: 'r' }, { v: money(m.cant * m.pu), c: 'r' }] })),\n        total: { label: 'Total (' + rows.length + ' registros)', cant: num(cant) + ' ' + M.unidadPl, monto: money(monto) }\n      };\n    }\n    return { kind: 'unknown', txt: 'No entendí la pregunta. Puedo responder sobre gasto o consumo de un material en una obra, o sobre el riesgo de retraso.' };\n  }\n\n  // ══════ acciones disponibles para las tres aplicaciones ══════\n  actions() {\n    const self = this;\n    const lab = id => { const m = self.S.materiales.find(x => x.id === id); return m; };\n    return {\n      login: id => { if (!USE encion: toNum(c.retencion), plazo: toNum(c.plazo), inicio: estado === 'EN_EJECUCION' ? today0() : null, estado, riesgo: null, gastoBase: 0, perim: f.perim || [] });\n          rows.forEach((r, i) => { const mat = {}; if (toNum(r.cem)) mat.cem = toNum(r.cem); if (toNum(r.fie)) mat.fie = toNum(r.fie); S.partidas.push({ id: id + '-' + i, obra: id, nombre: r.nombre, unidad: r.unidad, cant: toNum(r.cant), pu: toNum(r.pu), prog: 0, mat, meses: r.meses }); });\n        });\n        self.toast('Obra «' + f.nombre + '» creada · ' + estado.replace('_', ' '), 'ok'); return id;\n      },\n      // ── materiales: catálogo con atributos según el tipo y stock mínimo por obra\n      guardarMaterial: m => {\n        if (!self.can('material.gestionar')) return self.deny();\n        if (!self.needNet()) return false;\n        if (!String(m.nombre || '').trim() || !(toNum(m.precio) > 0) || !String(m.unidad || '').trim()) { self.toast('El material necesita nombre, unidad y precio mayor a 0', 'err'); return false; }\n        const attrs = (m.attrs || []).filter(x => String(x[0] || '').trim() && String(x[1] || '').trim());\n        self.upd(S => {\n          const ex = m.id ? S.materiales.find(x => x.id === m.id) : null;\n          const datos = { nombre: m.nombre.trim(), tipo: m.tipo, unidad: m.unidad.trim(), unidadPl: (m.unidadPl || m.unidad).trim(), precio: toNum(m.precio), prov: m.prov, attrs };\n          if (ex) Object.assign(ex, datos); else S.materiales.push(Object.assign({ id: 'm' + Date.now().toString(36) }, datos));\n        });\n        self.toast(m.id ? 'Material «' + m.nombre + '» actualizado' : 'Material «' + m.nombre + '» agregado al catálogo', 'ok');\n        return true;\n      },\n      setMinimo: (obra, mat, min) => {\n        if (!self.can('material.gestionar')) return self.deny();\n        if (!self.needNet()) return;\n        const v = toNum(min); if (v < 0) return self.toast('El stock mínimo no puede ser negativo', 'err');\n        self.upd(S => {\n          let st = S.stock.find(x => x.obra === obra && x.mat === mat);\n          if (!st) { st = { obra, mat, cant: 0, min: 0 }; S.stock.push(st); }\n          st.min = v;\n          self.revisarStock(S, obra, mat);\n        });\n        self.toast('Stock mínimo actualizado', 'ok');\n      },\n      publicarFoto: id => {\n        if (!self.can('foto.publicar')) return self.deny();\n        if (!self.needNet()) return;\n        self.upd(S => { const f = S.fotos.find(x => x.id === id); if (f) { f.publicada = true; f.pubTs = Date.now(); } });\n        self.toast('Foto publicada en el portal con los rostros difuminados', 'ok');\n      },\n      nuevaPlanilla: obraId => {\n        if (!self.can('planilla.editar')) { self.deny(); return null; }\n        const abierta = self.S.planillas.find(p => p.obra === obraId && p.estado !== 'APROBADA');\n        if (abierta) return abierta.id;\n        const id = 'pl' + Date.now().toString(36);\n        self.upd(S => { const n = S.planillas.filter(p => p.obra === obraId).reduce((a, p) => Math.max(a, p.num), 0) + 1; S.planillas.push({ id, num: n, obra: obraId, estado: 'BORRADOR', periodo: periodo(), lineas: {}, obs: null, creada: Date.now(), hist: [{ ts: Date.now(), t: 'Creada por ' + USERS[S.user].nombre }] }); });\n        return id;\n      },\n      setMedido: (plId, pid, v) => {\n        if (!self.can('planilla.editar')) return self.deny();\n        self.upd(S => { const p = S.planillas.find(x => x.id === plId); if (p && (p.estado === 'BORRADOR' || p.estado === 'OBSERVADA')) p.lineas[pid] = v; });\n      },\n      guardarPlanilla: plId => {\n        if (!self.can('planilla.editar')) return self.deny();\n        const off = !!self.S.erpOffline;\n        self.upd(S => { const p = S.planillas.find(x => x.id === plId); p.guardada = Date.now(); if (off) p.pendSync = true; });\n        self.toast(off ? 'Borrador guardado en el navegador · se enviará al servidor cuando vuelva la conexión' : 'Borrador guardado', off ? 'warn' : 'ok');\n      },\n      presentarPlanilla: plId => {\n        if (!self.can('planilla.editar')) return self.deny();\n        if (!self.needNet()) return;\n        const pl = self.S.planillas.find(x => x.id === plId); const c = self.calcPlanilla(self.S, pl);\n        if (c.errores) return self.toast('Corrige las partidas que superan lo contratado', 'err');\n        if (c.subtotal <= 0) return self.toast('La planilla no tiene avance medido', 'err');\n        self.upd(S => {\n          const p = S.planillas.find(x => x.id === plId); p.estado = 'PRESENTADA'; p.presentada = Date.now(); p.hist.push({ ts: Date.now(), t: 'Presentada al cliente por ' + USERS[S.user].nombre });\n          self.alerta(S, 'info', p.obra, 'Planilla', 'Planilla #' + p.num + ' presentada al cliente · neto ' + money(c.neto));\n        });\n        self.toast('Planilla #' + pl.num + ' presentada a ' + c.obra.cliente, 'ok');\n      },\n      observarPlanilla: (plId, motivo) => {\n        if (!self.can('planilla.aprobar')) return self.deny();\n        if (!String(motivo || '').trim()) return self.toast('Escribe el motivo de la observación', 'warn');\n        self.upd(S => {\n          const p = S.planillas.find(x => x.id === plId); if (p.estado !== 'PRESENTADA') return;\n          p.estado = 'OBSERVADA'; p.obs = motivo; p.hist.push({ ts: Date.now(), t: 'OBSERVADA por el cliente: ' + motivo });\n          self.alerta(S, 'warn', p.obra, 'Planilla', 'Planilla #' + p.num + ' OBSERVADA por el cliente: ' + motivo);\n        });\n        self.toast('Observación enviada a la constructora', 'ok');\n      },\n      aprobarPlanilla: plId => self.aprobar(plId),\n      cerrarSaga: () => self.setU({ saga: null }),\n      // ── reportes por voz: exportar la tabla de respaldo (CSV con separador «;», se abre directo en Excel)\n      exportarCSV: (nombre, cols, rows, total) => {\n        const esc = v => '\"' + String(v == null ? '' : v).replace(/\"/g, '\"\"') + '\"';\n        const lines = [cols.map(esc).join(';')].concat(rows.map(r => r.cells.map(c => esc(c.v)).join(';')));\n        if (total) lines.push([esc(total.label)].concat(cols.slice(1).map((c, i) => i === cols.length - 4 ? esc(total.cant) : i === cols.length - 2 ? esc(total.monto) : '\"\"')).join(';'));\n        try {\n          const blob = new Blob(['﻿' + lines.join('\\r\\n')], { type: 'text/csv;charset=utf-8' });\n          const url = URL.createObjectURL(blob), link = document.createElement('a');\n          link.href = url; link.download = (nombre || 'reporte') + '.csv'; document.body.appendChild(link); link.click();\n          setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 500);\n          self.toast('Reporte exportado para Excel (' + rows.length + ' filas)', 'ok');\n        } catch (e) { self.toast('No se pudo exportar el reporte en este navegador', 'err'); }\n      },\n      // ── agente\n      setAgente: (k, v) => self.upd(S => { S.agente[k] = v; }),\n      runAgent: () => { if (!self.needNet()) return; return self.runAgent(); },\n      decidirAgente: ok => {\n        if (!self.can('agente.usar')) return self.deny();\n        self.upd(S => {\n          if (!S.agente.prop) return; S.agente.prop.estado = ok ? 'APROBADA' : 'RECHAZADA';\n          if (ok) {\n            S.avisos.unshift({ id: uid(), para: 'crojas', ts: Date.now(), de: USERS[S.user].nombre + ' (vía agente)', txt: 'Escuela 1ro de Mayo está en riesgo ALTO de retraso. Por favor envía un plan de recuperación esta semana.' });\n            self.alerta(S, 'info', 'esc', 'Agente', 'Se pidió plan de recuperación a Ing. Carla Rojas');\n          }\n        });\n        self.toast(ok ? 'Notificación enviada a Ing. Carla Rojas' : 'Acción rechazada: el agente no hará nada', ok ? 'mail' : 'info');\n      }\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
